services:

  # ── Web Arayüzü (Node.js + React) ──────────────────────────────────────────
  ui:
    build:
      context: ./security-bot-ui
      dockerfile: Dockerfile
    container_name: ecy-s3cb0t-ui
    restart: unless-stopped
    ports:
      - "${UI_PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      SESSION_SECRET: "${SESSION_SECRET}"
      FORCE_SECURE_COOKIES: "${FORCE_SECURE_COOKIES:-false}"
      # Veritabanı yolu (volume mount ile kalıcı)
      DATABASE_URL: "/app/data/data.db"
      # Docker modunda bot ayrı container'da çalışır — yerel spawn devre dışı
      DOCKER_MODE: "true"
      BOT_DIR: "/nonexistent"
    volumes:
      - db_data:/app/data
    networks:
      - internal
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/auth/me"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # ── Python Bot (Telegram + Analiz) ─────────────────────────────────────────
  bot:
    build:
      context: ./wazuh-obs-bot
      dockerfile: Dockerfile
    container_name: ecy-s3cb0t-bot
    restart: unless-stopped
    depends_on:
      ui:
        condition: service_healthy
    environment:
      # Web UI adresi (internal Docker network üzerinden)
      WEB_UI_API: "http://ui:3000"
      # Telegram
      TELEGRAM_TOKEN: "${TELEGRAM_TOKEN}"
      TELEGRAM_CHAT_ID: "${TELEGRAM_CHAT_ID}"
      # Wazuh
      WAZUH_HOST: "${WAZUH_HOST}"
      WAZUH_USER: "${WAZUH_USER}"
      WAZUH_PASS: "${WAZUH_PASS}"
      WAZUH_ALERT_LEVEL: "${WAZUH_ALERT_LEVEL:-7}"
      # Observium
      OBSERVIUM_HOST: "${OBSERVIUM_HOST}"
      OBSERVIUM_USER: "${OBSERVIUM_USER}"
      OBSERVIUM_PASS: "${OBSERVIUM_PASS}"
      # Graylog (opsiyonel)
      GRAYLOG_HOST: "${GRAYLOG_HOST:-}"
      GRAYLOG_USER: "${GRAYLOG_USER:-}"
      GRAYLOG_PASS: "${GRAYLOG_PASS:-}"
      GRAYLOG_RANGE_SECONDS: "${GRAYLOG_RANGE_SECONDS:-3600}"
      # Fortinet (opsiyonel)
      FORTINET_HOST: "${FORTINET_HOST:-}"
      FORTINET_AUTH: "${FORTINET_AUTH:-token}"
      FORTINET_API_TOKEN: "${FORTINET_API_TOKEN:-}"
      FORTINET_USER: "${FORTINET_USER:-admin}"
      FORTINET_PASS: "${FORTINET_PASS:-}"
      FORTINET_VDOM: "${FORTINET_VDOM:-root}"
      # LLM
      LLM_PROVIDER: "${LLM_PROVIDER:-ollama}"
      # Ollama host makinede çalışıyorsa host.docker.internal üzerinden erişilir
      OLLAMA_HOST: "${OLLAMA_HOST:-http://host.docker.internal:11434}"
      OLLAMA_MODEL: "${OLLAMA_MODEL:-qwen2.5:3b}"
      OPENAI_BASE_URL: "${OPENAI_BASE_URL:-}"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      OPENAI_MODEL: "${OPENAI_MODEL:-}"
      # Rapor aralığı
      CHECK_INTERVAL_MINUTES: "${CHECK_INTERVAL_MINUTES:-30}"
    networks:
      - internal
    # Ollama host makinede çalışıyorsa erişim için
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  db_data:
    driver: local

networks:
  internal:
    driver: bridge
